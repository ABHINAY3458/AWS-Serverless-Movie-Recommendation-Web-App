<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Movie Recommendation App</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#f4f4f4;
    margin:0;
    padding:20px;
    text-align:center;
}

h1{
    color:#333;
}

button{
    background:#007bff;
    color:white;
    border:none;
    padding:12px 25px;
    border-radius:5px;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    background:#0056b3;
}

table{
    width:90%;
    margin:20px auto;
    border-collapse:collapse;
    background:white;
}

th,td{
    border:1px solid #ddd;
    padding:10px;
}

th{
    background:#007bff;
    color:white;
}

.section{
    margin-top:40px;
}

.error{
    color:red;
    margin-top:20px;
}
</style>

</head>
<body>

<h1>🎬 Movie Recommendation App</h1>

<button onclick="loadData()">Load Data</button>

<div id="error" class="error"></div>

<div class="section">
    <h2>Movies</h2>

    <table>
        <thead>
            <tr>
                <th>Movie ID</th>
                <th>Movie Name</th>
                <th>Category</th>
            </tr>
        </thead>

        <tbody id="movieTable">
        </tbody>
    </table>
</div>

<div class="section">
    <h2>Users</h2>

    <table>
        <thead>
            <tr>
                <th>User ID</th>
                <th>User Name</th>
            </tr>
        </thead>

        <tbody id="userTable">
        </tbody>
    </table>
</div>

<script>

async function loadData() {

    document.getElementById("error").innerHTML = "";

    try {

        const response = await fetch(
            "https://6lhcj0o81b.execute-api.ap-south-1.amazonaws.com/prod/data"
        );

        const result = await response.json();

        console.log("API Response:", result);

        let data;

        if(result.body){
            data = JSON.parse(result.body);
        }else{
            data = result;
        }

        let movieRows = "";
        let userRows = "";

        if(data.movies){

            data.movies.forEach(movie => {

                movieRows += `
                <tr>
                    <td>${movie.movieId || ""}</td>
                    <td>${movie.name || ""}</td>
                    <td>${movie.category || movie.categorie || ""}</td>
                </tr>
                `;
            });

            document.getElementById("movieTable").innerHTML = movieRows;
        }

        if(data.users){

            data.users.forEach(user => {

                userRows += `
                <tr>
                    <td>${user.userId || ""}</td>
                    <td>${user.UserName || user.username || ""}</td>
                </tr>
                `;
            });

            document.getElementById("userTable").innerHTML = userRows;
        }

    }
    catch(error){

        console.error(error);

        document.getElementById("error").innerHTML =
        "Error loading data. Check API Gateway, Lambda, or CORS settings.";
    }
}

</script>

</body>
</html>
